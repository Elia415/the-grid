<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi con Google - THE GRID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background-color: #ffffff;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justifyContent: center;
      min-height: 100vh;
      padding: 24px;
    }
    .g-card {
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .g-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 15px;
      color: #5f6368;
      margin-bottom: 28px;
      text-align: center;
    }
    .subtitle strong {
      color: #202124;
    }
    .accounts-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #dadce0;
      border-bottom: 1px solid #dadce0;
      margin-bottom: 24px;
    }
    .account-row {
      display: flex;
      align-items: center;
      padding: 14px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f3f4;
      transition: background-color 0.15s ease;
    }
    .account-row:last-child {
      border-bottom: none;
    }
    .account-row:hover {
      background-color: #f8f9fa;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 16px;
      background: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 500;
      color: #5f6368;
    }
    .account-info {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .account-name {
      font-size: 14px;
      font-weight: 500;
      color: #202124;
      line-height: 1.3;
    }
    .account-email {
      font-size: 12px;
      color: #5f6368;
      line-height: 1.3;
    }
    .custom-form {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .input-field:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }
    .btn-submit {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      align-self: flex-end;
      transition: background-color 0.2s ease;
    }
    .btn-submit:hover {
      background-color: #1557b0;
    }
    .footer-note {
      font-size: 12px;
      color: #5f6368;
      text-align: center;
      line-height: 1.4;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="g-card">
    <svg class="g-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>

    <h1>Accedi con Google</h1>
    <div class="subtitle">per continuare su <strong>THE GRID</strong></div>

    <form class="custom-form" id="customForm" style="display: flex;" onsubmit="submitCustomGoogleUser(event)">
      <input class="input-field" type="email" id="customEmail" placeholder="Indirizzo email Google" required autocomplete="email" />
      <input class="input-field" type="text" id="customName" placeholder="Nome visualizzato (facoltativo)" autocomplete="name" />
      <button class="btn-submit" type="submit">Continua</button>
    </form>

    <div class="footer-note" style="margin-top: 20px;">
      Accesso sicuro crittografato. Nessun dato sensibile verrà condiviso senza autorizzazione.
    </div>
  </div>

  <script>
    function sanitize(str) {
      if (!str) return '';
      return String(str).replace(/[<>]/g, '').slice(0, 100);
    }

    function selectGoogleUser(email, name, photoURL) {
      const cleanEmail = sanitize(email).toLowerCase();
      const cleanName = sanitize(name) || cleanEmail.split('@')[0];

      const payload = {
        type: 'GOOGLE_AUTH_POPUP_SUCCESS',
        profile: {
          email: cleanEmail,
          name: cleanName,
          photoURL: photoURL ? sanitize(photoURL) : null
        }
      };

      const targetOrigin = window.location.origin || '*';
      if (window.opener) {
        window.opener.postMessage(payload, targetOrigin);
      } else {
        localStorage.setItem('google_auth_bridge_payload', JSON.stringify(payload));
      }
      setTimeout(function() {
        window.close();
      }, 150);
    }

    function submitCustomGoogleUser(e) {
      e.preventDefault();
      const email = document.getElementById('customEmail').value.trim();
      const name = document.getElementById('customName').value.trim() || email.split('@')[0];
      if (!email) return;
      selectGoogleUser(email, name, null);
    }
  </script>
</body>
</html>
